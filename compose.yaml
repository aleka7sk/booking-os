services:
  booking-os:
    build: .
    ports:
      - "8080:8080"
    environment:
      BOOKING_OS_ADDR: ":8080"
      BOOKING_OS_DATA_PATH: "/app/data/booking-os.json"
      BOOKING_OS_ADMIN_EMAIL: "${BOOKING_OS_ADMIN_EMAIL:-owner@booking.local}"
      BOOKING_OS_ADMIN_PASSWORD: "${BOOKING_OS_ADMIN_PASSWORD:-demo1234}"
      BOOKING_OS_SESSION_SECRET: "${BOOKING_OS_SESSION_SECRET:-development-change-me}"
      BOOKING_OS_PUBLIC_URL: "${BOOKING_OS_PUBLIC_URL:-http://localhost:8080}"
    volumes:
      - booking_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  booking_data:
